---
name: Build & Push Docker Images

on:
  workflow_call:
    inputs:
      docker_build_context:
        description: "Path to docker build context"
        required: false
        type: string
        default: "."
      docker_build_file:
        description: "Path to the dockerfile within docker_build_context"
        required: false
        type: string
        default: "./Dockerfile"
      push_enabled:
        description: "Set to true to push the image"
        type: boolean
        required: false
        default: false
      push_destinations:
        description: >-
          A ';' separated list of push destinations. 'ghcr.io' is the only
          supported value; it is retained as an input because nearly every caller
          passes it explicitly. DockerHub support was removed, so passing
          'dockerhub' is now a hard error rather than being silently ignored.
        required: false
        type: string
        default: "ghcr.io"
      ghcr_repo_owner:
        description: "The github username/profile/organisation the repo to be pushed to belongs to"
        required: true
        type: string
        default: ""
      ghcr_repo:
        description: "The ghcr.io repository the image should be pushed to"
        required: true
        type: string
        default: ""
      platform_linux_arm32v7_enabled:
        description: "Set to true to build for the linux/arm/v7 platform"
        type: boolean
        required: false
        default: true
      platform_linux_arm64v8_enabled:
        description: "Set to true to build for the linux/arm64 platform"
        type: boolean
        required: false
        default: true
      platform_linux_amd64_enabled:
        description: "Set to true to build for the linux/amd64 platform"
        type: boolean
        required: false
        default: true
      build_latest:
        description: "Set to true to include a latest tag"
        type: boolean
        required: false
        default: true
      build_baseimage_test:
        description: "Set to true to include a baseimage-test tag"
        type: boolean
        required: false
        default: false
      build_baseimage_url:
        description: >-
          The PATTERN/REPLACEMENT half of a sed substitution used to redirect the
          Dockerfile's FROM line at a candidate base image. Despite the name this
          is not a URL. It is wrapped as sed 's/<value>/g', so
          ':base/:base-test-pr' rewrites '...docker-baseimage:base' to
          '...docker-baseimage:base-test-pr'. Chain substitutions by embedding
          '/g;s/'. Only read when build_baseimage_test is true.
        type: string
        required: false
        default: ""
      dockerfile_changes:
        description: >-
          The PATTERN/REPLACEMENT half of a sed substitution applied in place to
          the Dockerfile before building. Wrapped as sed -i 's/<value>/g'.
        type: string
        required: false
        default: ""
      docker_latest_tag:
        description: "The tag to use for the latest tag"
        type: string
        required: false
        default: "latest"

      # --- runtime verification -------------------------------------------
      # A green build used to mean only "the image built". s6-overlay 3.2.3.1
      # relocated the s6-rc user bundle directory and every downstream container
      # silently stopped starting its services while CI stayed green. These
      # inputs gate an assertion that the image's s6 service graph is actually
      # sound. The expected service set is discovered from the image itself, so
      # no repo needs to configure anything.
      verify_s6_enabled:
        description: "Assert the image's s6 service graph after building it"
        type: boolean
        required: false
        default: true
      verify_s6_runtime_platform:
        description: >-
          Platform whose build additionally gets the runtime (boot-the-container)
          assertions. Other platforms get the static assertions, which need no
          emulation and still cover the deprecated-bundle-directory regression.
          Set to "all" to attempt runtime assertions on every platform.
        type: string
        required: false
        default: "linux/amd64"
      verify_s6_container_env:
        description: >-
          Optional newline-separated KEY=VALUE pairs to pass into the container.
          Opt-in only; the assertions are designed to work with no credentials.
        type: string
        required: false
        default: ""
      verify_s6_http_probe:
        description: >-
          Optional URL that must answer from inside the container. Opt-in extra
          assertion for images that serve HTTP.
        type: string
        required: false
        default: ""
      verify_s6_strict_startup:
        description: >-
          Fail when a service is not up even if credentials were withheld. Off by
          default because most of this fleet cannot start without user credentials.
        type: boolean
        required: false
        default: false

    secrets:
      ghcr_token:
        description: "If pushing to ghcr.io, this should be a github token"
        required: false

jobs:
  workflows_env:
    name: Prepare workflow environment
    runs-on: ubuntu-24.04

    outputs:
      docker_build_context: ${{ steps.workflow_env_build.outputs.context }}
      docker_build_file: ${{ steps.workflow_env_build.outputs.file }}
      push_enabled: ${{ steps.workflow_env_push_enabled.outputs.push_enabled }}
      output_ghcr_io_enabled: ${{ steps.workflow_env_push_destinations.outputs.ghcr_io_enabled }}
      ghcr_repo: ${{ steps.workflow_env_ghcr_repo.outputs.ghcr_repo}}
      ghcr_repo_owner: ${{ steps.workflow_env_ghcr_repo_owner.outputs.ghcr_repo_owner}}
      build_latest: ${{ steps.workflow_env_build_latest.outputs.build_latest }}
      build_latest_tag: ${{ steps.workflow_env_build_latest.outputs.docker_latest_tag }}
      build_baseimage_test: ${{ steps.workflow_env_build_baseimage_test.outputs.build_baseimage_test }}
      # The PATTERN/REPLACEMENT half of a sed substitution, not a URL. See the
      # "Dockerfile rewriting" comment block in the build job for the full
      # explanation of how this is wrapped and why callers look the way they do.
      build_baseimage_url: ${{ steps.workflow_env_build_baseimage_test.outputs.build_baseimage_url }}
      dockerfile_changes: ${{ steps.workflow_env_dockerfile_changes.outputs.dockerfile_changes }}
      digest_id: ${{ steps.export_digest.outputs.digest_id }}

    steps:
      # Check out code
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Export id
        id: export_digest
        run: |
          # create a unique id for the digest
          id="$(uuidgen)"
          echo "digest_id=$id" >> $GITHUB_OUTPUT

      # Check imported environment variable PUSH_ENABLED
      - name: "check 'push_enabled'"
        id: workflow_env_push_enabled
        env:
          PUSH_ENABLED: ${{ inputs.push_enabled }}
        run: |
          FAIL_STEP=0
          if [[ "${PUSH_ENABLED,,}" == "true" ]]; then
            echo "push_enabled=true" >> $GITHUB_OUTPUT
          elif [[ "${PUSH_ENABLED,,}" == "false" ]]; then
            echo "push_enabled=false" >> $GITHUB_OUTPUT
          else
            echo "::error title=${{ github.job }}: Environment variable invalid::push_enabled should be 'true' or 'false'"
            FAIL_STEP=1
          fi
          exit $FAIL_STEP

      # Check imported environment variable PUSH_DESTINATIONS
      - name: "check 'push_destinations'"
        id: workflow_env_push_destinations
        # if: ${{ steps.workflow_env_push_enabled.outputs.push_enabled == 'true' }}
        env:
          PUSH_DESTINATIONS: ${{ inputs.push_destinations }}
        run: |
          FAIL_STEP=0
          echo "ghcr_io_enabled=false" >> $GITHUB_OUTPUT
          IFS=';' read -r -a PUSH_DESTINATIONS_ARRAY <<< "$PUSH_DESTINATIONS"
          for PUSH_DESTINATION in "${PUSH_DESTINATIONS_ARRAY[@]}"; do
            if [[ "${PUSH_DESTINATION,,}" == 'ghcr.io' ]]; then
              echo "ghcr_io_enabled=true" >> $GITHUB_OUTPUT
            elif [[ "${PUSH_DESTINATION,,}" == 'dockerhub' ]]; then
              echo "::error title=${{ github.job }}: DockerHub support removed::push_destinations includes 'dockerhub', which is no longer supported. Remove it, and remove any dockerhub_profile/dockerhub_repo/dockerhub_username inputs and the dockerhub_token secret."
              FAIL_STEP=1
            else
              echo "::error title=${{ github.job }}: Environment variable invalid::push_destinations includes '$PUSH_DESTINATION'. Expected ';' separated list containing 'ghcr.io'"
              FAIL_STEP=1
            fi
          done
          exit $FAIL_STEP

      # Check imported environment variable ghcr_repo
      - name: "check 'ghcr_repo'"
        id: workflow_env_ghcr_repo
        if: ${{ steps.workflow_env_push_destinations.outputs.ghcr_io_enabled == 'true' }}
        env:
          GHCR_REPO: ${{ inputs.ghcr_repo }}
        run: |
          FAIL_STEP=0
          if [[ -n "${GHCR_REPO}" ]]; then
            echo "ghcr_repo=${GHCR_REPO,,}" >> $GITHUB_OUTPUT
          else
            echo "::error title=${{ github.job }}: Environment variable invalid::ghcr_repo is empty"
            FAIL_STEP=1
          fi
          exit $FAIL_STEP

      # Check imported environment variable ghcr_repo
      - name: "check 'ghcr_repo_owner'"
        id: workflow_env_ghcr_repo_owner
        if: ${{ steps.workflow_env_push_destinations.outputs.ghcr_io_enabled == 'true' }}
        env:
          GHCR_REPO_OWNER: ${{ inputs.ghcr_repo_owner }}
        run: |
          FAIL_STEP=0
          if [[ -n "${GHCR_REPO_OWNER}" ]]; then
            echo "ghcr_repo_owner=${GHCR_REPO_OWNER,,}" >> $GITHUB_OUTPUT
          else
            echo "::error title=${{ github.job }}: Environment variable invalid::ghcr_repo_owner is empty"
            FAIL_STEP=1
          fi
          exit $FAIL_STEP

      # Check imported environment variables PLATFORM_<platform>_ENABLED
      - name: "check 'PLATFORM_<platform>_ENABLED'"
        id: workflow_env_platform_enabled
        env:
          PLATFORM_LINUX_ARM32V7_ENABLED: ${{ inputs.platform_linux_arm32v7_enabled }}
          PLATFORM_LINUX_ARM64V8_ENABLED: ${{ inputs.platform_linux_arm64v8_enabled }}
          PLATFORM_LINUX_AMD64_ENABLED: ${{ inputs.platform_linux_amd64_enabled }}
        run: |
          set -x
          FAIL_STEP=0
          NUM_ARCHES=0
          if [[ "${PLATFORM_LINUX_ARM32V7_ENABLED,,}" == "true" ]]; then
            echo "linux_arm32v7=true" >> $GITHUB_OUTPUT
            NUM_ARCHES=$((NUM_ARCHES+1))
          fi
          if [[ "${PLATFORM_LINUX_ARM64V8_ENABLED,,}" == "true" ]]; then
            echo "linux_arm64=true" >> $GITHUB_OUTPUT
            NUM_ARCHES=$((NUM_ARCHES+1))
          fi
          if [[ "${PLATFORM_LINUX_AMD64_ENABLED,,}" == "true" ]]; then
            echo "linux_amd64=true" >> $GITHUB_OUTPUT
            NUM_ARCHES=$((NUM_ARCHES+1))
          fi
          if [[ "$NUM_ARCHES" -le 0 ]]; then
            echo "::error title=${{ github.job }}: Environment variable invalid::platform_<platform>_enabled need at least one platform enabled"
            FAIL_STEP=1
          fi
          exit $FAIL_STEP

      # Check imported environment variables build_latest
      - name: "check 'build_latest'"
        id: workflow_env_build_latest
        env:
          BUILD_LATEST: ${{ inputs.build_latest }}
          DOCKER_LATEST_TAG: ${{ inputs.docker_latest_tag }}
        run: |
          set -x
          FAIL_STEP=0
          if [[ "${BUILD_LATEST,,}" == "true" ]]; then
            echo "build_latest=true" >> $GITHUB_OUTPUT
          fi

          if [[ -z "${DOCKER_LATEST_TAG}" ]]; then
              echo "::error title=${{ github.job }}: Environment variable invalid::DOCKER_LATEST_TAG is empty"
              FAIL_STEP=1
            else
              echo "docker_latest_tag=${DOCKER_LATEST_TAG}" >> $GITHUB_OUTPUT
          fi

          exit $FAIL_STEP

      # Check imported environment variables build_baseimage_test

      - name: "check 'build_baseimage_test'"
        id: workflow_env_build_baseimage_test
        env:
          BUILD_BASEIMAGE_TEST: ${{ inputs.build_baseimage_test }}
          BUILD_BASEIMAGE_URL: ${{ inputs.build_baseimage_url }}
        run: |
          set -x
          FAIL_STEP=0
          if [[ "${BUILD_BASEIMAGE_TEST,,}" == "true" ]]; then
            echo "build_baseimage_test=true" >> $GITHUB_OUTPUT
            if [[ -z "${BUILD_BASEIMAGE_URL}" ]]; then
              echo "::error title=${{ github.job }}: Environment variable invalid::BUILD_BASEIMAGE_URL is empty"
              FAIL_STEP=1
            else
              echo "build_baseimage_url=${BUILD_BASEIMAGE_URL}" >> $GITHUB_OUTPUT
            fi
          else
            echo "build_baseimage_test=false" >> $GITHUB_OUTPUT
          fi
          exit $FAIL_STEP

      # Check imported environment variables docker_build_*
      - name: "check 'docker_build_*'"
        id: workflow_env_build
        env:
          DOCKER_BUILD_CONTEXT: ${{ inputs.docker_build_context }}
          DOCKER_BUILD_FILE: ${{ inputs.docker_build_file }}
        run: |
          set -x
          FAIL_STEP=0
          if [[ -n "${DOCKER_BUILD_CONTEXT}" ]]; then
            echo "context=${DOCKER_BUILD_CONTEXT}" >> $GITHUB_OUTPUT
          else
            FAIL_STEP=1
            echo "::error title=${{ github.job }}: Environment variable invalid::DOCKER_BUILD_CONTEXT is empty"
          fi
          if [[ -n "${DOCKER_BUILD_FILE}" ]]; then
            echo "file=${DOCKER_BUILD_FILE}" >> $GITHUB_OUTPUT
          else
            FAIL_STEP=1
            echo "::error title=${{ github.job }}: Environment variable invalid::DOCKER_BUILD_FILE is empty"
          fi
          exit $FAIL_STEP

      - name: "check dockerfile_changes"
        id: workflow_env_dockerfile_changes
        env:
          DOCKERFILE_CHANGES: ${{ inputs.dockerfile_changes }}
        run: |
          set -x
          FAIL_STEP=0
          if [[ -n "${DOCKERFILE_CHANGES}" ]]; then
            echo "dockerfile_changes=${DOCKERFILE_CHANGES}" >> $GITHUB_OUTPUT
          fi
          exit $FAIL_STEP
  build:
    name: Build (manifest)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            TARGET_NAME: linux/amd64
            ENABLED: ${{ inputs.platform_linux_amd64_enabled }}
          - os: ubuntu-24.04-arm
            arch: arm64
            TARGET_NAME: linux/arm64
            ENABLED: ${{ inputs.platform_linux_arm64v8_enabled }}
          - os: ubuntu-24.04-arm
            arch: arm32
            TARGET_NAME: linux/arm/v7
            ENABLED: ${{ inputs.platform_linux_arm32v7_enabled }}
    needs: [workflows_env]
    outputs:
      docker_full_name_tags: ${{ steps.image_names_tags.outputs.full_name_tags }}
      docker_tags: ${{ steps.image_names_tags.outputs.tags }}
    steps:
      - name: Prepare
        if: ${{ matrix.ENABLED }}
        id: prepare
        run: |
          platform=${{ matrix.TARGET_NAME }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_OUTPUT
      # Check out code
      - name: Checkout
        if: ${{ matrix.ENABLED }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Log into ghcr.io
      - name: Login to GitHub Container Registry
        if: ${{ needs.workflows_env.outputs.output_ghcr_io_enabled == 'true'  &&   matrix.ENABLED }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ needs.workflows_env.outputs.ghcr_repo_owner }}
          password: ${{ secrets.ghcr_token }}

      # Set up buildx
      - name: Set up Docker Buildx
        if: ${{ matrix.ENABLED }}
        id: buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      # =====================================================================
      # Dockerfile rewriting
      #
      # Both steps below build the SAME artefact: <docker_build_file>.use, which
      # is what actually gets built. Every path through this section must produce
      # it, which is why there is an explicit copy for the no-rewrite case.
      #
      # HOW build_baseimage_url AND dockerfile_changes ARE INTERPRETED
      #
      # Neither input is a URL, despite the name. Each is the MIDDLE of a sed
      # substitution -- the "PATTERN/REPLACEMENT" part. The workflow wraps it:
      #
      #     sed 's/' + <input> + '/g'
      #
      # So `build_baseimage_url: :base/:base-test-pr` becomes:
      #
      #     sed 's/:base/:base-test-pr/g'
      #
      # which rewrites `FROM ...docker-baseimage:base` to
      # `FROM ...docker-baseimage:base-test-pr`, letting a PR build against a
      # candidate base image instead of the published one.
      #
      # Because the input lands inside the expression, a caller can chain
      # substitutions by embedding sed syntax. This is why some callers look odd:
      #
      #     :wreadsb/:wreadsb-test-pr/g;s/:dump978-full/:dump978-full-test-pr
      #  -> sed 's/:wreadsb/:wreadsb-test-pr/g;s/:dump978-full/:dump978-full-test-pr/g'
      #
      # That is two substitutions, for an image whose Dockerfile has two FROM
      # lines to redirect. The trailing `/g` is supplied by the wrapper, which is
      # why the caller's value ends without one.
      #
      # Consequences worth knowing before editing a caller:
      #   * `/` is the delimiter, so patterns cannot contain a literal `/` unless
      #     escaped; that is why values are written as `:base/:base-test-pr`
      #     rather than as full image URLs.
      #   * the pattern is a regex, not a literal, so `.` matches any character.
      #   * the substitution is global and unanchored, so it applies to every
      #     matching line, not only FROM lines.
      #
      # Values are passed through the environment rather than interpolated
      # directly into the shell, so that a value containing shell metacharacters
      # cannot alter the command being run.
      # =====================================================================
      - name: Apply dockerfile_changes to the Dockerfile
        id: change_dockerfile
        if: ${{ needs.workflows_env.outputs.dockerfile_changes  &&   matrix.ENABLED }}
        env:
          DOCKERFILE_CHANGES: ${{ needs.workflows_env.outputs.dockerfile_changes }}
          BUILD_FILE: ${{ needs.workflows_env.outputs.docker_build_file }}
        run: |
          set -euo pipefail
          if [[ -n "$DOCKERFILE_CHANGES" ]]; then
            echo "applying: sed 's/${DOCKERFILE_CHANGES}/g'"
            sed -i "s/${DOCKERFILE_CHANGES}/g" "$BUILD_FILE"
          fi

      # Redirect the FROM line(s) at a candidate base image instead of the
      # published one. Produces the .use file consumed by the build steps.
      - name: Patch Dockerfile to correct base image
        if: ${{ needs.workflows_env.outputs.build_baseimage_test == 'true'  &&   matrix.ENABLED }}
        env:
          BASEIMAGE_SED: ${{ needs.workflows_env.outputs.build_baseimage_url }}
          BUILD_FILE: ${{ needs.workflows_env.outputs.docker_build_file }}
        run: |
          set -euo pipefail
          echo "applying: sed 's/${BASEIMAGE_SED}/g'"
          sed "s/${BASEIMAGE_SED}/g" <"$BUILD_FILE" >"${BUILD_FILE}.use"
          echo "--- FROM lines after rewrite ---"
          grep -n '^[[:space:]]*FROM' "${BUILD_FILE}.use" || true

      # No rewrite requested, but the build steps always read the .use file.
      - name: Copy dockerfile to correct name
        if: ${{ needs.workflows_env.outputs.build_baseimage_test == 'false'  &&   matrix.ENABLED }}
        env:
          BUILD_FILE: ${{ needs.workflows_env.outputs.docker_build_file }}
        run: |
          set -euo pipefail
          cp "$BUILD_FILE" "${BUILD_FILE}.use"

      # Determine image names/tags
      - name: Determine image names/tags
        id: image_names_tags
        if: ${{ matrix.ENABLED }}
        run: |
          set -x
          IMAGE_NAMES=()
          if [[ "${{ needs.workflows_env.outputs.output_ghcr_io_enabled }}" == 'true' ]]; then
            IMAGE_NAMES+=("ghcr.io/${{ needs.workflows_env.outputs.ghcr_repo }}")
          fi
          if [[ "${{ needs.workflows_env.outputs.push_enabled }}" == "false" ]]; then
            IMAGE_NAMES+=("test_build")
          fi
          printf -v IMAGE_NAMES_CSV '%s,' "${IMAGE_NAMES[@]}"
          echo "names=${IMAGE_NAMES_CSV::-1}" >> $GITHUB_OUTPUT
          IMAGE_TAGS=()
          if [[ "${{ needs.workflows_env.outputs.build_latest }}" == "true" ]]; then
            IMAGE_TAGS+=("${{ needs.workflows_env.outputs.build_latest_tag }}")
            IMAGE_TAGS+=("${{ needs.workflows_env.outputs.build_latest_tag }}-build-$GITHUB_RUN_NUMBER")
          fi
          if [[ "${{ needs.workflows_env.outputs.build_baseimage_test }}" == "true" ]]; then
            if [[ "${{ needs.workflows_env.outputs.build_latest_tag }}" == "latest" ]]; then
              IMAGE_TAGS+=("baseimage-test")
            else
              IMAGE_TAGS+=("${{ needs.workflows_env.outputs.build_latest_tag }}-baseimage-test")
            fi
          fi
          printf -v IMAGE_TAGS_CSV '%s,' "${IMAGE_TAGS[@]}"
          echo "tags=${IMAGE_TAGS_CSV::-1}" >> $GITHUB_OUTPUT
          IMAGE_FULL_TAGS=()
          for IMAGE_NAME in "${IMAGE_NAMES[@]}"; do
            for IMAGE_TAG in "${IMAGE_TAGS[@]}"; do
              IMAGE_FULL_TAGS+=("$IMAGE_NAME:$IMAGE_TAG")
            done
          done
          printf -v IMAGE_FULL_TAGS_CSV '%s,' "${IMAGE_FULL_TAGS[@]}"
          echo "full_name_tags=${IMAGE_FULL_TAGS_CSV::-1}" >> $GITHUB_OUTPUT

      # Get metadata from repo
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        if: ${{ matrix.ENABLED }}
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.image_names_tags.outputs.names }}

      # Build & push final images (push enabled)
      - name: Build & Push Final Image
        id: build
        if: ${{ matrix.ENABLED && needs.workflows_env.outputs.push_enabled == 'true' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ needs.workflows_env.outputs.docker_build_context }}
          file: ${{ needs.workflows_env.outputs.docker_build_file }}.use
          platforms: ${{ matrix.TARGET_NAME }}
          tags: ghcr.io/${{ needs.workflows_env.outputs.ghcr_repo }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,compression=zstd,compression-level=6,force-compression=true

      # Build final image without pushing (push disabled)
      - name: Build Final Image (no push)
        id: build_no_push
        if: ${{ matrix.ENABLED && needs.workflows_env.outputs.push_enabled != 'true' }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ needs.workflows_env.outputs.docker_build_context }}
          file: ${{ needs.workflows_env.outputs.docker_build_file }}.use
          platforms: ${{ matrix.TARGET_NAME }}
          tags: ghcr.io/${{ needs.workflows_env.outputs.ghcr_repo }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,push=false,oci-mediatypes=true,compression=zstd,compression-level=6,force-compression=true

      # ---------------------------------------------------------------------
      # Runtime verification of the just-built per-architecture image.
      #
      # This sits deliberately between the per-arch build and the manifest merge:
      # the image exists here and is inspectable, whereas after the merge there is
      # only a manifest list. A failure here stops the tag from ever being
      # published, because `merge` needs `build`.
      #
      # The builds above export with `outputs: type=image`, which does not place
      # anything in the local Docker daemon, so nothing is runnable yet. This step
      # re-exports the same already-built layers with `load: true`; buildx serves
      # them from cache, so it is an export rather than a rebuild.
      # ---------------------------------------------------------------------
      - name: Load image locally for s6 verification
        id: verify_load
        if: ${{ matrix.ENABLED && inputs.verify_s6_enabled }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ needs.workflows_env.outputs.docker_build_context }}
          file: ${{ needs.workflows_env.outputs.docker_build_file }}.use
          platforms: ${{ matrix.TARGET_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: sdre-verify-local:${{ steps.prepare.outputs.PLATFORM_PAIR }}
          push: false
          load: true

      # `$/` is the self-repository reference: it resolves to THIS repository at
      # the exact commit that is running. That matters here because callers pin
      # sdre.yml by full SHA, and a plain `./` path inside a reusable workflow
      # resolves against the *caller's* checkout (a long-standing limitation) so
      # it would fail with "Can't find action.yml". A hardcoded `@main` would
      # work but would quietly defeat every caller's SHA pin -- one bad commit
      # here would reach all ~35 repos at once. `$/` keeps the action locked to
      # the same commit as this workflow file.
      # Requires an Actions runner >= 2.336.0 (GitHub-hosted runners are fine).
      # Not available on GitHub Enterprise Server.
      - name: Verify s6 services
        if: ${{ matrix.ENABLED && inputs.verify_s6_enabled }}
        uses: $/.github/actions/verify-s6-services
        with:
          image: sdre-verify-local:${{ steps.prepare.outputs.PLATFORM_PAIR }}
          # Runtime assertions need to execute the image. Static assertions do not
          # and always run. The regression this exists for is architecture
          # independent, so asserting it at runtime on one platform is sufficient.
          runtime_checks: ${{ inputs.verify_s6_runtime_platform == 'all' || inputs.verify_s6_runtime_platform == matrix.TARGET_NAME }}
          container_env: ${{ inputs.verify_s6_container_env }}
          http_probe: ${{ inputs.verify_s6_http_probe }}
          strict_startup: ${{ inputs.verify_s6_strict_startup }}

      - name: Export digest
        if: ${{ matrix.ENABLED && needs.workflows_env.outputs.push_enabled == 'true' }}
        id: export_digest
        run: |
          # create a unique id for the digest
          id="${{ needs.workflows_env.outputs.digest_id }}"
          mkdir -p ${{ runner.temp }}/$id/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/$id/digests/${digest#sha256:}"
          echo "Output digest directory: ${{ runner.temp }}/$id/digests"
          ls -la ${{ runner.temp }}/$id/digests

      - name: Upload digest
        if: ${{ matrix.ENABLED && needs.workflows_env.outputs.push_enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ needs.workflows_env.outputs.digest_id }}-${{ steps.prepare.outputs.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/${{ needs.workflows_env.outputs.digest_id }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build, workflows_env]
    if: ${{ needs.workflows_env.outputs.push_enabled == 'true' }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ needs.workflows_env.outputs.digest_id }}-*
          merge-multiple: true

      # Log into ghcr.io
      - name: Login to GitHub Container Registry
        if: ${{ needs.workflows_env.outputs.output_ghcr_io_enabled == 'true' }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ needs.workflows_env.outputs.ghcr_repo_owner }}
          password: ${{ secrets.ghcr_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          # if we aren't pushing, we don't need to do anything
          if [[ "${{ needs.workflows_env.outputs.push_enabled }}" != "true" ]]; then
            echo "Skipping manifest creation as push is disabled"
            exit 0
          fi

          IMAGE_NAMES=()
          if [[ "${{ needs.workflows_env.outputs.output_ghcr_io_enabled }}" == 'true' ]]; then
            IMAGE_NAMES+=("ghcr.io/${{ needs.workflows_env.outputs.ghcr_repo }}")
          fi

          IFS=',' read -r -a TAGS <<< "${{ needs.build.outputs.docker_tags }}"

          for tag in "${TAGS[@]}"; do
            echo "Processing tag: $tag"

            for image_name in "${IMAGE_NAMES[@]}"; do
              echo "Creating manifest for $image_name:$tag"
              docker buildx imagetools create -t "$image_name:$tag" \
                $(printf "$image_name@sha256:%s " *)
            done
          done

      # Report images
      - name: Log images built & pushed
        if: ${{ needs.workflows_env.outputs.push_enabled == 'true' }}
        run: |
          echo "::notice title=${{ github.job }} (manifest): Images built & pushed::${{ needs.build.outputs.docker_full_name_tags }}"
