---
name: Test Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/sdre.yml
    name: "Build & Push Latest"
    with:
      push_enabled: true
      ghcr_repo_owner: mikenye
      ghcr_repo: ${{ github.repository }}
      build_latest: true
      build_baseimage_test: false

    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  build_baseimage_test:
    uses: ./.github/workflows/sdre.yml
    name: "Build & Push Test base image"
    with:
      push_enabled: true
      ghcr_repo_owner: mikenye
      ghcr_repo: ${{ github.repository }}
      build_latest: false
      build_baseimage_test: true
      # should not change anything, but why not
      build_baseimage_url: :acars-decoder-soapy/:acars-decoder-soapy-test-pr

    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  # End-to-end check of base_variant through the real workflow: the fixture's
  # FROM names the stable base and its RUN fails unless it is running on forky.
  build_base_variant:
    uses: ./.github/workflows/sdre.yml
    name: "Build on the forky base variant"
    with:
      push_enabled: false
      ghcr_repo_owner: mikenye
      ghcr_repo: ${{ github.repository }}
      docker_build_file: test_fixtures/base-variant-build/Dockerfile
      base_variant: forky
      platform_linux_arm32v7_enabled: false
      platform_linux_arm64v8_enabled: false
      verify_s6_enabled: false

    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  # Proves the base variant rewrite handles every reference form and still
  # refuses each input that would otherwise yield a mislabelled "next" image.
  base_variant_selftest:
    name: "Base variant rewrite self-test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the base variant self-test
        run: ./test_fixtures/run-base-variant-selftest.sh

  # Proves the s6 verifier still detects each way a container can be broken.
  # The positive cases matter far less than the negative ones: every image that
  # carried the s6-overlay 3.2.3.1 regression built and ran successfully, so a
  # suite that only checked "it builds" could never have caught it.
  verify_s6_selftest:
    name: "Verify s6 assertions detect broken images"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the verifier self-test
        run: ./test_fixtures/run-selftest.sh

  all_tests_passed:
    name: All tests passed
    runs-on: ubuntu-latest
    needs:
      - build
      - build_baseimage_test
      - build_base_variant
      - base_variant_selftest
      - verify_s6_selftest
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "build_baseimage_test: ${{ needs.build_baseimage_test.result }}"
          echo "build_base_variant: ${{ needs.build_base_variant.result }}"
          echo "base_variant_selftest: ${{ needs.base_variant_selftest.result }}"
          echo "verify_s6_selftest: ${{ needs.verify_s6_selftest.result }}"

          if [[ "${{ needs.build.result }}" != "success" ]] ||
             [[ "${{ needs.build_baseimage_test.result }}" != "success" ]] ||
             [[ "${{ needs.build_base_variant.result }}" != "success" ]] ||
             [[ "${{ needs.base_variant_selftest.result }}" != "success" ]] ||
             [[ "${{ needs.verify_s6_selftest.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi

          echo "✅ All jobs succeeded"
