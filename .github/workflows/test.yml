---
name: Test Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    uses: ./.github/workflows/sdre.yml
    name: "Build & Push Latest"
    with:
      push_enabled: true
      ghcr_repo_owner: mikenye
      ghcr_repo: ${{ github.repository }}
      build_latest: true
      build_baseimage_test: false

    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  build_baseimage_test:
    uses: ./.github/workflows/sdre.yml
    name: "Build & Push Test base image"
    with:
      push_enabled: true
      ghcr_repo_owner: mikenye
      ghcr_repo: ${{ github.repository }}
      build_latest: false
      build_baseimage_test: true
      # should not change anything, but why not
      build_baseimage_url: :acars-decoder-soapy/:acars-decoder-soapy-test-pr

    secrets:
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}

  # Proves the s6 verifier still detects each way a container can be broken.
  # The positive cases matter far less than the negative ones: every image that
  # carried the s6-overlay 3.2.3.1 regression built and ran successfully, so a
  # suite that only checked "it builds" could never have caught it.
  verify_s6_selftest:
    name: "Verify s6 assertions detect broken images"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run the verifier self-test
        run: ./test_fixtures/run-selftest.sh

  all_tests_passed:
    name: All tests passed
    runs-on: ubuntu-latest
    needs:
      - build
      - build_baseimage_test
      - verify_s6_selftest
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "build: ${{ needs.build.result }}"
          echo "build_baseimage_test: ${{ needs.build_baseimage_test.result }}"
          echo "verify_s6_selftest: ${{ needs.verify_s6_selftest.result }}"

          if [[ "${{ needs.build.result }}" != "success" ]] ||
             [[ "${{ needs.build_baseimage_test.result }}" != "success" ]] ||
             [[ "${{ needs.verify_s6_selftest.result }}" != "success" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi

          echo "✅ All jobs succeeded"
